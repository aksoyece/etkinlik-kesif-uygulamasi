name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node 24 / npm 11 ile üretilen lock, GHA npm 10’da peer eksikleri yüzünden kırılabiliyor
      - run: npm install -g npm@10.9.2
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
